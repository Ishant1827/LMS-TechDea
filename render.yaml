# Render blueprint for the TechDea LMS.
# Two services: an Express API (web) and the Vite React client (static).
# Import via Render → Blueprints, or use it as the reference for manual setup.

services:
  # ── API ────────────────────────────────────────────────────────────────
  - type: web
    name: server-lms-xj9d
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Explicit, not assumed. Render sets it for Node services anyway, but
      # behaviour that depends on it should not rest on a platform default.
      - key: NODE_ENV
        value: production
      - key: MONGO_URI          # MongoDB Atlas connection string (…/techdea_lms?…)
        sync: false
      - key: JWT_SECRET         # long random string
        sync: false
      - key: JWT_EXPIRES
        value: 7d
      - key: CLIENT_ORIGIN      # exact origin of the client, no trailing slash
        value: https://lms-client-szuv.onrender.com

  # ── Client ─────────────────────────────────────────────────────────────
  - type: web
    name: lms-client-szuv
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # SPA fallback: serve index.html for client-side routes (/login, etc.)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Security headers for the app itself (G1). The CSP's job is script-src
    # 'self': an injected <script> or inline handler will not run, which is the
    # second barrier behind the URL allowlist. Images and frames stay open to any
    # https host because lessons embed teacher-supplied video and file links.
    # connect-src must name the API — keep it in step with VITE_API_URL below.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https:; connect-src 'self' https://server-lms-xj9d.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Frame-Options
        value: DENY
    envVars:
      - key: VITE_API_URL       # MUST include the /api path
        value: https://server-lms-xj9d.onrender.com/api
